<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="ball">
      <circle cx="256.0" cy="256.0" r="204.8"/>
    </clipPath>
    <radialGradient id="bg-grad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2258d4"/>
      <stop offset="100%" stop-color="#0e2e8a"/>
    </radialGradient>
    <radialGradient id="ball-grad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eeeef4"/>
      <stop offset="100%" stop-color="#d0d4e0"/>
    </radialGradient>
    <radialGradient id="shine-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112.6" fill="url(#bg-grad)"/>

  <!-- Ball shadow -->
  <circle cx="266.2" cy="268.3" r="213.0"
          fill="rgba(0,0,0,0.35)" filter="url(#shadow)"/>

  <!-- Ball base -->
  <circle cx="256.0" cy="256.0" r="204.8" fill="url(#ball-grad)"/>

  <!-- Tango triads (clipped to ball) -->
  <g clip-path="url(#ball)">
    <circle cx="401.44" cy="339.97" r="65.54" fill="#131c3a"/>
<circle cx="323.40" cy="339.97" r="65.54" fill="#131c3a"/>
<circle cx="362.42" cy="272.38" r="65.54" fill="#131c3a"/>
<circle cx="256.00" cy="423.94" r="65.54" fill="#131c3a"/>
<circle cx="216.98" cy="356.35" r="65.54" fill="#131c3a"/>
<circle cx="295.02" cy="356.35" r="65.54" fill="#131c3a"/>
<circle cx="110.56" cy="339.97" r="65.54" fill="#131c3a"/>
<circle cx="149.58" cy="272.38" r="65.54" fill="#131c3a"/>
<circle cx="188.60" cy="339.97" r="65.54" fill="#131c3a"/>
<circle cx="110.56" cy="172.03" r="65.54" fill="#131c3a"/>
<circle cx="188.60" cy="172.03" r="65.54" fill="#131c3a"/>
<circle cx="149.58" cy="239.62" r="65.54" fill="#131c3a"/>
<circle cx="256.00" cy="88.06" r="65.54" fill="#131c3a"/>
<circle cx="295.02" cy="155.65" r="65.54" fill="#131c3a"/>
<circle cx="216.98" cy="155.65" r="65.54" fill="#131c3a"/>
<circle cx="401.44" cy="172.03" r="65.54" fill="#131c3a"/>
<circle cx="362.42" cy="239.62" r="65.54" fill="#131c3a"/>
<circle cx="323.40" cy="172.03" r="65.54" fill="#131c3a"/>

  </g>

  <!-- Seam lines (clipped to ball) -->
  <g clip-path="url(#ball)">
    <line x1="256.0" y1="256.0" x2="424.5" y2="353.3" stroke="#c8ccd8" stroke-width="4.1"/>
<line x1="256.0" y1="256.0" x2="256.0" y2="450.6" stroke="#c8ccd8" stroke-width="4.1"/>
<line x1="256.0" y1="256.0" x2="87.5" y2="353.3" stroke="#c8ccd8" stroke-width="4.1"/>
<line x1="256.0" y1="256.0" x2="87.5" y2="158.7" stroke="#c8ccd8" stroke-width="4.1"/>
<line x1="256.0" y1="256.0" x2="256.0" y2="61.4" stroke="#c8ccd8" stroke-width="4.1"/>
<line x1="256.0" y1="256.0" x2="424.5" y2="158.7" stroke="#c8ccd8" stroke-width="4.1"/>

  </g>

  <!-- Ball outline -->
  <circle cx="256.0" cy="256.0" r="204.8"
          fill="none" stroke="#9098b0" stroke-width="3.6"/>

  <!-- Shine highlight -->
  <circle cx="256.0" cy="256.0" r="204.8"
          fill="url(#shine-grad)" clip-path="url(#ball)"/>
</svg>